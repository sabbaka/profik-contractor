name: Contractor CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # .nvmrc, not a major on its own: @testing-library/react-native
          # declares node ^22.13.0 || >=24, so a bare "20" installs a toolchain
          # its own engines field calls unsupported. Reading the pin also stops
          # CI and local drifting apart, which is how a lockfile goes bad.
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run format:check

      - run: npm run i18n:check

      - run: npm run shared:check

      # Coverage is reported, not enforced: there is no threshold on purpose —
      # a percentage on a suite this size is a number, not a signal. The
      # report is kept so the number is there when someone wants to look.
      - run: npm run test:coverage

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contractor-coverage-report
          path: coverage
          retention-days: 14
