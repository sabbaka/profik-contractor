name: Contractor CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # .nvmrc, not a major on its own: @testing-library/react-native
          # declares node ^22.13.0 || >=24, so a bare "20" installs a toolchain
          # its own engines field calls unsupported. Reading the pin also stops
          # CI and local drifting apart, which is how a lockfile goes bad.
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run format:check

      - run: npm run i18n:check

      - run: npm run shared:check

      - run: npm test
